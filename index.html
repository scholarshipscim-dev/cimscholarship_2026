<!DOCTYPE html>
<html lang="en">
<head>

<title>CIM Vancouver Branch — Student Awards Portal</title>
<style>

  --navy: #0b2340; --navy-light: #123a63; --gold: #c99a2e; --bg: #f5f7fa;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
.site-header { background: var(--navy); color: #fff; padding: 16px 0; }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; }

.admin-link:hover { color: rgba(255,255,255,0.55); text-decoration: underline; }
main.wrap { padding-top: 28px; padding-bottom: 60px; }
.intro-card, .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px 28px; margin-bottom: 24px; }
h1 { font-size: 22px; margin: 0 0 10px; color: var(--navy); }
h2 { font-size: 18px; color: var(--navy); }

.scholarship-list summary { cursor: pointer; color: var(--navy-light); font-weight: 600; margin-top: 10px; }
.scholarship-list p { margin-top: 12px; }
.elig-text { color: var(--hint); font-size: 13px; margin-top: 8px; }
.alert { padding: 14px 18px; border-radius: 8px; margin-bottom: 18px; }

.login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 14px; }

.program-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.program-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; }
.program-card .program-eyebrow { color: var(--gold); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.program-card h2 { margin: 0 0 8px; }
.program-card p.blurb { flex: 1; color: #40495a; font-size: 14px; }

.program-card .btn-primary { align-self: flex-start; }

  /* Ranked applicant tables become stacked cards instead of a horizontally
     scrolling table — much easier to read/tap on a phone. */

@media (max-width: 420px) {

<body>
<div id="app"></div>

<script>
/* ============================================================
   CIM Vancouver Branch — Grad Studies Award & Turnbull Cup Portal
   Live version: submissions, judge scores and rankings are sent
   to a small Google Apps Script backend (Code.gs) which stores
   them in a Google Sheet and stores uploaded files/photos in
   Google Drive. See SETUP.md for how to deploy that backend.
   ============================================================ */

// ---- REQUIRED: paste your deployed Apps Script Web App URL here ----
// (Deploy > New deployment > Web app > Execute as Me > Who has access: Anyone,
// then copy the URL ending in /exec. See SETUP.md.)
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwA2yhIWzT_Qe2u9UP1RnbtR5wQIJ_dhRqX-7bVqODcJQuk4HCjLn8XxVUIWM_P8S-LEQ/exec';
const BACKEND_CONFIGURED = BACKEND_URL.indexOf('PASTE_YOUR_') !== 0;

// Credentials are not stored in plaintext in this page — only a SHA-256 hash of
// "username:password" is kept, and the submitted login is hashed the same way and
// compared to it. The SAME hash is also required (as `key`) on every admin read/write
// call to the backend, so it's checked server-side too, not just in this page's JS.
// This is still not real authentication (view-source shows the hash, and swapping in a
// different password just means re-hashing it) — treat it as a light deterrent, matching
// the level of access-control a small volunteer-run contest actually needs.
const ADMIN_CREDENTIAL_HASH = 'a6b76499777887a6e37a332d381deb8abca74dcab5e008f1ee6ed592547800d7';
async function sha256Hex(str) {
  const bytes = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

/* ---------------- backend helpers ---------------- */
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.readAsDataURL(file);
  });
}
// text/plain content-type keeps this a "simple request" so the browser skips a CORS
// preflight (Apps Script Web Apps don't handle OPTIONS preflights well).
async function postToBackend(payload) {
  const res = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('Server returned ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function getFromBackend(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(BACKEND_URL + '?' + qs);
  if (!res.ok) throw new Error('Server returned ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
// Drive files are shared "anyone with the link, view only" by the backend, so these
// well-known Drive endpoints can embed/link to them directly from the public page.
function driveThumb(fileId, size) { return fileId ? ('https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=w' + size) : ''; }
function driveFileUrl(fileMeta) { return fileMeta && fileMeta.url ? fileMeta.url : '#'; }

const UBC = 'University of British Columbia';
const SFU = 'Simon Fraser University';
const OTHER_DEPARTMENT_VALUE = 'Other (please specify)';
const ELIGIBLE_DEPARTMENTS = {
  [UBC]: ['Mining Engineering', 'Materials Engineering', 'Earth and Ocean Sciences', 'Geological Engineering', OTHER_DEPARTMENT_VALUE],
  [SFU]: ['Earth Sciences', OTHER_DEPARTMENT_VALUE],
};
const THESIS_BASED_PROGRAM_TYPES = ['Ph.D.', "Master's (Thesis-based / Research)"];
const PROGRAM_TYPES = ['Ph.D.', "Master's (Thesis-based / Research)", 'Master of Engineering (M.Eng., non-thesis)'];

// Shared across both programs — winners of either award must attend Student
// Night in person to receive their award.
const STUDENT_NIGHT_TEXT = 'Winners must be present at Student Night on November 26, 2026 at the Vancouver Convention Centre to receive their award.';

const SCHOLARSHIP = {
  id: 'grad-studies-award',
  name: 'Grad Studies Award',
  sponsor: 'CIM Vancouver Branch',
  amount: '$2,000 (3 available)',
  deadline: 'November 5, 2026',
  contactEmail: 'vancouver@cim.org',
  eligibilityText: 'Contest open to all earth science and mineral engineering related graduate students in the first year of a M.A.Sc, M.Sc or Ph.D program in the Greater Vancouver area. Please see award announcement for application details. The successful applicants are selected by a panel of experts from the CIM Vancouver branch.',
  detailedEligibilityText: "Per the award announcement: first-year graduate students enrolled in either a Ph.D. or research-based (thesis) Master's program at the University of British Columbia (Mining Engineering, Materials Engineering, Geological Engineering, or Earth and Ocean Sciences) or Simon Fraser University (Earth Sciences). If your program isn't listed, select \"Other (please specify)\" and tell us your program. Master of Engineering (M.Eng.) non-thesis students are not eligible for this award.",
  applicationPackageText: "A complete application includes: a Research Summary of the applicant's current or proposed research (maximum 3 pages), a one-page Resume including contact information, a Cover Letter, and Proof of Enrollment documenting full-time registration as a first-year graduate student.",
  studentNightText: STUDENT_NIGHT_TEXT,
  otherDepartmentValue: OTHER_DEPARTMENT_VALUE,
  criteria: [
    { id: 'first-year-grad', label: 'First-year graduate student', weight: 2, check: (a) => a.firstYearGrad === 'Yes' },
    { id: 'phd-or-thesis-masters', label: "Enrolled in a Ph.D. or research-based (thesis) Master's program (M.Eng. non-thesis is not eligible)", weight: 2, check: (a) => THESIS_BASED_PROGRAM_TYPES.includes(a.programType) },
    { id: 'eligible-institution-department', label: 'Enrolled at UBC (Mining Engineering, Materials Engineering, Geological Engineering, or Earth and Ocean Sciences) or SFU (Earth Sciences)', weight: 2, check: (a) => !!(a.institution && a.department && (ELIGIBLE_DEPARTMENTS[a.institution] || []).includes(a.department)) },
  ],
};

const TURNBULL_SCHOOL_OPTIONS = [
  'BCIT Mining Technology',
  'BCIT other',
  'SFU Earth Sciences',
  'SFU other',
  'UBC Earth & Ocean Science',
  'UBC Geological Engineering',
  'UBC Materials Engineering',
  'UBC Mining Engineering',
  'UBC other',
  'Other',
];

const TURNBULL_CUP = {
  id: 'turnbull-cup',
  name: 'Turnbull Cup Photo Contest',
  sponsor: 'CIM Vancouver Branch',
  amount: '$1,000 (top photo) + the Turnbull Cup awarded to the winning photographer’s student society',
  deadline: 'November 5, 2026',
  contactEmail: 'Alex.Doll@cimvancouver.org',
  contactEmail2: 'vancouver@cim.org',
  eligibilityText: 'Contest is open to all Earth-Science and Mineral Engineering related graduate, undergraduate, or technical college students in the greater Vancouver area.',
  prizesText: 'The photographer of the single best photo submitted will be awarded a $1,000 prize and the student society the photographer belongs to will be awarded the Turnbull Cup. Judging will be done by the CIM Vancouver Branch Executive Committee.',
  rules: [
    'Photographer agrees that he/she personally took the photos and they were ethically obtained.',
    'Photographer is granting CIM the right to use any photo submitted for other CIM related uses, including publishing on the Internet or print media.',
    'Photos from worksites must be approved by the company if they are potentially injurious to the company. No photos of accident scenes, confidential process operations, or other sensitive material. If in doubt, ask your workplace.',
    'Electronic submissions must be high quality JPG files (quality > 85%), no more than 2.5 Megabyte in size, and at least 1024x768 pixels in dimensions.',
    'Photographers are expected to attend Student Night on November 26, 2026 at the Vancouver Convention Centre. The winner will be announced and the prize awarded at Student Night — the winner must be present to receive their award.',
  ],
  studentNightText: STUDENT_NIGHT_TEXT,
  schoolOptions: TURNBULL_SCHOOL_OPTIONS,
  photo: { maxBytes: 2.5 * 1024 * 1024, minWidth: 1024, minHeight: 768 },
};

/* ---------------- Judging rubric (mirrors scoring.js) ---------------- */
const DIMENSIONS = [
  { id: 'originality', label: 'Originality' },
  { id: 'clarity', label: 'Clarity' },
  { id: 'technical', label: 'Technical' },
  { id: 'relevance', label: 'Relevance' },
];
const JUDGES = Array.from({ length: 10 }, (_, i) => ({ id: `judge${i + 1}`, label: `Judge ${i + 1}` }));
const AI_ROW = { id: 'ai', label: 'Claude (AI Preliminary Read)' };
const MIN_SCORE = 0;
const MAX_SCORE = 10;
const MAX_ROW_TOTAL = DIMENSIONS.length * MAX_SCORE; // 40
const MAX_GRAND_TOTAL = MAX_ROW_TOTAL * JUDGES.length; // 120

function emptyRow(kind) { const row = {}; if (kind === 'judge') row.name = ''; if (kind === 'ai') row.notes = ''; DIMENSIONS.forEach((d) => (row[d.id] = null)); return row; }
function emptyJudgeScores() { const scores = {}; JUDGES.forEach((j) => (scores[j.id] = emptyRow('judge'))); scores[AI_ROW.id] = emptyRow('ai'); return scores; }
function parseScoreValue(raw) {
  if (raw === undefined || raw === null || String(raw).trim() === '') return null;
  const n = Number(raw);
  if (Number.isNaN(n)) return null;
  return Math.max(MIN_SCORE, Math.min(MAX_SCORE, Math.round(n * 10) / 10));
}
function rowTotal(row) {
  if (!row) return null;
  const values = DIMENSIONS.map((d) => row[d.id]);
  if (values.some((v) => v === null || v === undefined)) return null;
  return Math.round(values.reduce((s, v) => s + v, 0) * 10) / 10;
}
// Not every judge scores every applicant, so the headline number is an average
// across whichever judges DID submit a complete score, not a sum that requires
// all 10 to have scored.
function judgesAverage(judgeScores) {
  if (!judgeScores) return { average: null, count: 0 };
  const totals = JUDGES.map((j) => rowTotal(judgeScores[j.id])).filter((t) => t !== null);
  if (!totals.length) return { average: null, count: 0 };
  const average = Math.round((totals.reduce((s, t) => s + t, 0) / totals.length) * 10) / 10;
  return { average, count: totals.length };
}

/* ---------------- Eligibility scoring (mirrors ranking.js) ---------------- */
function scoreAgainstScholarship(application, scholarship) {
  const criteriaResults = scholarship.criteria.map((c) => ({ id: c.id, label: c.label, weight: c.weight, met: !!c.check(application) }));
  const metCount = criteriaResults.filter((c) => c.met).length;
  const totalCount = criteriaResults.length;
  const weightedMet = criteriaResults.reduce((s, c) => s + (c.met ? c.weight : 0), 0);
  const weightedTotal = criteriaResults.reduce((s, c) => s + c.weight, 0);
  const percentage = weightedTotal === 0 ? 0 : Math.round((weightedMet / weightedTotal) * 100);
  return { scholarshipId: scholarship.id, name: scholarship.name, metCount, totalCount, percentage, criteriaResults };
}
function scoreApplication(application) {
  const best = scoreAgainstScholarship(application, SCHOLARSHIP);
  return { best, meetsAllCriteria: !!best && best.metCount === best.totalCount && best.totalCount > 0 };
}
function splitByEligibility(applications) {
  const eligible = applications
    .filter((a) => a.scoring.meetsAllCriteria)
    .sort((a, b) => new Date(a.submittedAt) - new Date(b.submittedAt));
  const notEligible = applications
    .filter((a) => !a.scoring.meetsAllCriteria)
    .sort((a, b) => {
      const pctDiff = (b.scoring.best?.percentage || 0) - (a.scoring.best?.percentage || 0);
      if (pctDiff !== 0) return pctDiff;
      const metDiff = (b.scoring.best?.metCount || 0) - (a.scoring.best?.metCount || 0);
      if (metDiff !== 0) return metDiff;
      return new Date(a.submittedAt) - new Date(b.submittedAt);
    });
  return { eligible, notEligible };
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return 'app_' + Date.now() + '_' + Math.random().toString(16).slice(2); }

// Populated from the backend when the admin dashboard is opened (see loadAdminData).
// Regular visitors never fetch this list — only their own submission is sent, and only
// to the backend, never back down to their browser.
let applications = [];
let turnbullSubmissions = [];
let turnbullRankings = {

/* ---------------- Turnbull Cup 10-judge top-5 ranking tool ----------------
   Mirrors turnbullRanking.js: 10 judges each pick and rank up to 5 favourite
   entries (rank 1 = best). Points (5/4/3/2/1) tally into a leaderboard. */
const TURNBULL_JUDGE_COUNT = 10;
const TURNBULL_RANK_SLOTS = 5;
const TURNBULL_RANK_POINTS = [5, 4, 3, 2, 1];
function turnbullComputeLeaderboard(entries, rankings) {
  const points = {};
  entries.forEach((e) => (points[e.id] = 0));
  rankings.judges.forEach((j) => {
    j.picks.forEach((entryId, idx) => {
      if (entryId && Object.prototype.hasOwnProperty.call(points, entryId)) points[entryId] += TURNBULL_RANK_POINTS[idx] || 0;
    });
  });
  return entries
    .map((e) => ({ entry: e, points: points[e.id] || 0 }))
    .sort((a, b) => b.points - a.points || new Date(a.entry.submittedAt) - new Date(b.entry.submittedAt));
}
function turnbullSanitizePicks(rawPicks, validIds) {
  const seen = new Set();
  return rawPicks.map((id) => {
    if (!id || !validIds.has(id) || seen.has(id)) return null;
    seen.add(id);
    return id;
  });
}

// Fetches the latest applications/entries/rankings from the backend, then shows the
// dashboard. Called on login and every time an admin returns to "All applications" —
// several committee members may be reviewing from different computers at once.
async function openAdminDashboard() {
  document.getElementById('app').innerHTML = `${header({ titleLine: 'Admin Review Dashboard', adminNav: true })}<main class="wrap"><p class="loading-state">Loading latest submissions…</p></main>`;
  try {
    const data = await getFromBackend({ action: 'state', key: state.adminKey });
    applications = data.applications || [];
    applications.forEach((a) => { a.judgeScores = a.judgeScores || emptyJudgeScores(); a.scoring = scoreApplication(a); });
    turnbullSubmissions = data.turnbullSubmissions || [];
    if (data.turnbullRankings) turnbullRankings = data.turnbullRankings;
    state.loadError = null;
  } catch (err) {
    state.loadError = 'Could not load submissions from the server (' + err.message + '). Check your connection and try again.';
  }
  go('adminDashboard');
}

    const photoInput = e.target.querySelector('input[name="photo"]');
    const file = photoInput.files[0];
    if (!file) errors.push('Photo upload is required.');

    async function finish(photoDataUrl) {
      if (errors.length) { state.errors = errors; state.formValues = values; render(); return; }
      if (!BACKEND_CONFIGURED) { state.errors = ['The site owner still needs to finish setup (BACKEND_URL is not configured yet) — see the notice above.']; state.formValues = values; render(); return; }

        state.errors = ['Could not submit your entry: ' + err.message + '. Please try again.'];
        state.formValues = values;
        render();
      }
    }

    if (!file) { finish(null); return; }
    if (file.size > TURNBULL_CUP.photo.maxBytes) errors.push('Photo must be no more than 2.5MB (received ' + (file.size / (1024 * 1024)).toFixed(2) + 'MB).');
    if (!/\.jpe?g$/i.test(file.name)) errors.push('Photo must be a JPG file.');

    const reader = new FileReader();
    reader.onload = function () {
      const img = new Image();
      img.onload = function () {
        if (img.naturalWidth < TURNBULL_CUP.photo.minWidth || img.naturalHeight < TURNBULL_CUP.photo.minHeight) {
          errors.push('Photo must be at least 1024x768 pixels (received ' + img.naturalWidth + 'x' + img.naturalHeight + ').');
        }
        finish(reader.result);
      };
      img.onerror = function () { finish(reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function () { finish(null); };
    reader.readAsDataURL(file);
  });
}

function criterionMet(app, criterionId) {
  const best = app.scoring && app.scoring.best;
  const c = best && best.criteriaResults.find((x) => x.id === criterionId);
  return !!(c && c.met);
}
function critIcon(met) { return met ? `<span class="crit-yes">&#10003; Yes</span>` : `<span class="crit-no">&#10007; No</span>`; }
function totalScoreCell(app) {
  const { average, count } = judgesAverage(app.judgeScores);
  return average === null
    ? `<span class="hint">Not yet scored</span>`
    : `<strong>${average}</strong> <span class="hint">/ ${MAX_ROW_TOTAL} (avg of ${count} judge${count === 1 ? '' : 's'})</span>`;
}

      <td class="rank-cell" data-label="#">#${i + 1}</td>
      <td data-label="Applicant">${escapeHtml(app.fullName)}<br /><span class="hint">${escapeHtml(app.email)}</span></td>
      <td data-label="Graduate Student Criteria">${critIcon(criterionMet(app, 'phd-or-thesis-masters'))}</td>
      <td data-label="First-Year Criteria">${critIcon(criterionMet(app, 'first-year-grad'))}</td>
      <td data-label="UBC/SFU Criteria">${critIcon(criterionMet(app, 'eligible-institution-department'))}</td>
      <td data-label="Judges' Average Score">${totalScoreCell(app)}</td>
      <td class="hint" data-label="Submitted">${new Date(app.submittedAt).toLocaleDateString()}</td>
      <td data-label="" class="view-cell"><button class="btn-secondary btn-small" onclick="go('adminApplication', {selectedApplicationId:'${app.id}'})">View</button></td>
    </tr>`;
}

function applicantTable(list) {
  if (!list.length) return `<p class="empty-state">No applications in this category yet.</p>`;
  const rows = list.map((app, i) => applicantRow(app, i)).join('');
  return `<table class="rank-table"><thead><tr><th>#</th><th>Applicant</th><th>Graduate Student Criteria</th><th>First-Year Criteria</th><th>UBC/SFU Criteria</th><th>Judges' Average Score</th><th>Submitted</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function turnbullRow(sub, i) {
  const fileId = sub.photoFile && sub.photoFile.fileId;
  return `
    <tr>
      <td class="rank-cell" data-label="#">#${i + 1}</td>
      <td class="thumb-cell" data-label="Photo"><a href="#" onclick="go('adminTurnbullEntry', {selectedTurnbullId:'${sub.id}'});return false;"><img class="photo-thumb" src="${driveThumb(fileId, 200)}" alt="Thumbnail of ${escapeHtml(sub.fullName)}'s submission" /></a></td>
      <td data-label="Photographer">${escapeHtml(sub.fullName)}<br /><span class="hint">${escapeHtml(sub.email)}</span></td>
      <td data-label="School/Department">${escapeHtml(sub.school)}</td>
      <td data-label="Location">${escapeHtml(sub.location)}<br /><span class="hint">${escapeHtml(sub.country)}</span></td>
      <td class="hint" data-label="Submitted">${new Date(sub.submittedAt).toLocaleDateString()}</td>
      <td data-label="" class="view-cell"><button class="btn-secondary btn-small" onclick="go('adminTurnbullEntry', {selectedTurnbullId:'${sub.id}'})">View</button></td>
    </tr>`;
}

function turnbullTable(list) {
  if (!list.length) return `<p class="empty-state">No entries submitted yet.</p>`;
  const rows = list.map((sub, i) => turnbullRow(sub, i)).join('');
  return `<table class="rank-table turnbull-table"><thead><tr><th>#</th><th>Photo</th><th>Photographer</th><th>School/Department</th><th>Location</th><th>Submitted</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function turnbullLeaderboardTable(leaderboard) {
  if (!leaderboard.length) return `<p class="empty-state">No entries to rank yet.</p>`;
  const rows = leaderboard.map((row, i) => {
    const fileId = row.entry.photoFile && row.entry.photoFile.fileId;
    return `
    <tr>
      <td class="rank-cell" data-label="#">#${i + 1}</td>
      <td class="thumb-cell" data-label="Photo"><a href="#" onclick="go('adminTurnbullEntry', {selectedTurnbullId:'${row.entry.id}'});return false;"><img class="photo-thumb" src="${driveThumb(fileId, 200)}" alt="Thumbnail of ${escapeHtml(row.entry.fullName)}'s submission" /></a></td>
      <td data-label="Photographer">${escapeHtml(row.entry.fullName)}<br /><span class="hint">${escapeHtml(row.entry.school)}</span></td>
      <td data-label="Points">${row.points > 0 ? `<strong>${row.points}</strong> <span class="hint">pts</span>` : `<span class="hint">No picks yet</span>`}</td>
      <td data-label="" class="view-cell"><button class="btn-secondary btn-small" onclick="go('adminTurnbullEntry', {selectedTurnbullId:'${row.entry.id}'})">View</button></td>
    </tr>`;
  }).join('');
  return `<table class="rank-table turnbull-table"><thead><tr><th>#</th><th>Photo</th><th>Photographer</th><th>Points</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function rankSelect(judgeId, rankIdx, entries, currentEntryId) {
  const options = entries.map((e) => `<option value="${e.id}" ${e.id === currentEntryId ? 'selected' : ''}>${escapeHtml(e.fullName)}</option>`).join('');
  return `<select name="${judgeId}_rank${rankIdx}" class="rank-select"><option value="">&mdash;</option>${options}</select>`;
}

function turnbullRankingsForm(rankings, entries) {
  if (!entries.length) {
    return `<section class="intro-card" id="turnbull-rankings"><h2>Judges' rankings</h2><p class="hint">No entries submitted yet — rankings will be available once entries come in.</p></section>`;
  }
  const rows = rankings.judges.map((j) => {
    const rankCells = Array.from({ length: TURNBULL_RANK_SLOTS }, (_, i) => `<td>${rankSelect(j.id, i + 1, entries, j.picks[i])}</td>`).join('');
    return `<tr><td class="judge-label">${escapeHtml(j.label)}${judgeNameInput(j, j.name)}</td>${rankCells}</tr>`;
  }).join('');
  const rankHeaders = Array.from({ length: TURNBULL_RANK_SLOTS }, (_, i) => `<th>Rank ${i + 1}${i === 0 ? ' (best)' : ''}</th>`).join('');
  return `
    <section class="intro-card" id="turnbull-rankings">
      <h2>Judges' rankings</h2>
      <p class="hint">Each of the ${TURNBULL_JUDGE_COUNT} panel judges can add their name and pick their top ${TURNBULL_RANK_SLOTS} favourite entries, ranked 1 (best) through ${TURNBULL_RANK_SLOTS}. Points (${TURNBULL_RANK_POINTS.join('/')}) are tallied automatically into the leaderboard above.</p>
      <form id="turnbullRankingsForm">
        <div class="table-scroll">
          <table class="scoring-table">
            <thead><tr><th>Judge</th>${rankHeaders}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <button type="submit" class="btn-primary" id="turnbullRankingsSaveBtn" style="margin-top:16px;">Save Rankings</button>
      </form>
    </section>`;
}

function renderAdminDashboard() {
  if (!requireAdminOrRedirect()) return;
  const { eligible, notEligible } = splitByEligibility(applications);
  const legend = SCHOLARSHIP.criteria.map((c) => `<li>${escapeHtml(c.label)}</li>`).join('');
  const leaderboard = turnbullComputeLeaderboard(turnbullSubmissions, turnbullRankings);
  const loadErrorHtml = state.loadError ? `<div class="alert alert-error">${escapeHtml(state.loadError)}</div>` : '';

  document.getElementById('app').innerHTML = `
    ${header({ titleLine: 'Admin Review Dashboard', adminNav: true })}
    <main class="wrap">
      ${SETUP_BANNER}
      ${loadErrorHtml}
      <section class="intro-card">
        <h1>${escapeHtml(SCHOLARSHIP.name)} — Applications</h1>
        <p class="hint">${escapeHtml(SCHOLARSHIP.amount)} &middot; Sponsor: ${escapeHtml(SCHOLARSHIP.sponsor)} &middot; Deadline: ${escapeHtml(SCHOLARSHIP.deadline)}</p>
        <p>Every application is automatically checked against the three eligibility criteria below and split into two lists — eligible applicants are prioritized for review.</p>
        <ul class="criteria-legend">${legend}</ul>
        <p class="hint">${eligible.length} meets eligibility criteria &middot; ${notEligible.length} does not meet eligibility criteria</p>
        <div style="margin-top:14px; display:flex; gap:10px;">
          <button class="btn-secondary btn-small" onclick="go('home')">&larr; Back to home</button>
          <button class="btn-secondary btn-small" onclick="openAdminDashboard()">&#8635; Refresh</button>
        </div>
      </section>
      <div class="dashboard-section">
        <span class="section-heading section-heading-eligible">&#10003; Meets Eligibility Criteria — Prioritized (${eligible.length})</span>
        ${applicantTable(eligible)}
      </div>
      <div class="dashboard-section">
        <span class="section-heading section-heading-ineligible">Does Not Meet Eligibility Criteria (${notEligible.length})</span>
        ${applicantTable(notEligible)}
      </div>

      <section class="intro-card" style="margin-top:40px;">
        <h1>${escapeHtml(TURNBULL_CUP.name)} — Entries</h1>
        <p class="hint">${escapeHtml(TURNBULL_CUP.amount)} &middot; Sponsor: ${escapeHtml(TURNBULL_CUP.sponsor)} &middot; ${escapeHtml(TURNBULL_CUP.deadline)}</p>
        <p>Judged manually by the CIM Vancouver Branch Executive Committee — this section lists every entry received, separate from the Grad Studies Award applications above.</p>
        <p class="hint">${turnbullSubmissions.length} entr${turnbullSubmissions.length === 1 ? 'y' : 'ies'} submitted</p>
      </section>
      <div class="dashboard-section">
        ${turnbullTable(turnbullSubmissions)}
      </div>

      <section class="intro-card" style="margin-top:40px;">
        <h1>Turnbull Cup — Leaderboard</h1>
        <p>Ranked by points from the judges' rankings tool below (5 points for a judge's #1 pick down to 1 point for their #5 pick).</p>
      </section>
      <div class="dashboard-section">
        ${turnbullLeaderboardTable(leaderboard)}
      </div>
      <div class="dashboard-section">
        ${turnbullRankingsForm(turnbullRankings, turnbullSubmissions)}
      </div>
    </main>
  `;

  const rankingsForm = document.getElementById('turnbullRankingsForm');
  if (rankingsForm) {
    rankingsForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const validIds = new Set(turnbullSubmissions.map((s) => s.id));
      const updatedJudges = turnbullRankings.judges.map((j) => {
        const name = String(fd.get(j.id + '_name') || '').trim();
        const rawPicks = Array.from({ length: TURNBULL_RANK_SLOTS }, (_, i) => {
          const val = fd.get(j.id + '_rank' + (i + 1));
          return val ? String(val) : null;
        });
        return { id: j.id, label: j.label, name, picks: turnbullSanitizePicks(rawPicks, validIds) };
      });
      const btn = document.getElementById('turnbullRankingsSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await postToBackend({ action: 'saveTurnbullRankings', key: state.adminKey, rankings: { judges: updatedJudges } });
        turnbullRankings = { judges: updatedJudges };
        state.loadError = null;
        render();
      } catch (err) {
        state.loadError = 'Could not save rankings: ' + err.message;
        render();
      }
    });
  }
}

function renderAdminTurnbullEntry() {
  if (!requireAdminOrRedirect()) return;
  const submission = turnbullSubmissions.find((s) => s.id === state.selectedTurnbullId);
  const fileId = submission.photoFile && submission.photoFile.fileId;
  document.getElementById('app').innerHTML = `
    ${header({ titleLine: 'Admin Review Dashboard', adminNav: true })}
    <main class="wrap">
      <p><a href="#" onclick="go('adminDashboard');return false;">&larr; All applications</a></p>
      <section class="intro-card">
        <h1>${escapeHtml(submission.fullName)}</h1>
        <p class="hint">Entry for the ${escapeHtml(TURNBULL_CUP.name)}</p>
        <img class="photo-preview-large" src="${driveThumb(fileId, 1600)}" alt="Photo submitted by ${escapeHtml(submission.fullName)}" />
        <div class="detail-grid">
          <div><span class="hint">Email</span><br />${escapeHtml(submission.email)}</div>
          <div><span class="hint">School/Department</span><br />${escapeHtml(submission.school)}</div>
          <div><span class="hint">Location</span><br />${escapeHtml(submission.location)}</div>
          <div><span class="hint">Country</span><br />${escapeHtml(submission.country)}</div>
          <div><span class="hint">Submitted</span><br />${new Date(submission.submittedAt).toLocaleString()}</div>
        </div>
        <div class="text-block">
          <span class="hint">Description of photo</span>
          <p>${escapeHtml(submission.photoDescription)}</p>
        </div>
        <div class="doc-links">
          <a class="btn-secondary" href="${escapeHtml(driveFileUrl(submission.photoFile))}" target="_blank" rel="noopener">&#128196; Open original file: ${escapeHtml(submission.photoFileName)}</a>
        </div>
      </section>
    </main>
  `;
}

function scoreInput(rowId, dim, currentValue) {
  const val = (currentValue === null || currentValue === undefined) ? '' : currentValue;
  return `<input type="number" min="${MIN_SCORE}" max="${MAX_SCORE}" step="1" name="${rowId}_${dim.id}" value="${val}" class="score-input" />`;
}

function judgeNameInput(judge, currentName) {
  return `<input type="text" name="${judge.id}_name" value="${escapeHtml(currentName || '')}" placeholder="Evaluator name" class="judge-name-input" />`;
}

function judgingRubricSection(application) {
  const rows = JUDGES.map((j) => {
    const row = application.judgeScores[j.id] || emptyRow('judge');
    const cells = DIMENSIONS.map((d) => `<td>${scoreInput(j.id, d, row[d.id])}</td>`).join('');
    const total = rowTotal(row);
    return `<tr><td class="judge-label">${escapeHtml(j.label)}${judgeNameInput(j, row.name)}</td>${cells}<td class="row-total">${total === null ? '—' : total}</td></tr>`;
  }).join('');
  const aiRowData = application.judgeScores[AI_ROW.id] || emptyRow('ai');
  const aiCells = DIMENSIONS.map((d) => `<td>${scoreInput(AI_ROW.id, d, aiRowData[d.id])}</td>`).join('');
  const aiTotal = rowTotal(aiRowData);
  const { average: judgesAvg, count: judgesCount } = judgesAverage(application.judgeScores);

  return `
    <section class="intro-card">
      <h2>Judging rubric</h2>
      <p class="hint">Each of the ${JUDGES.length} panel judges can add their name and scores the application 0–10 on four dimensions. The average below reflects only judges who have submitted a complete score — not every judge needs to score every applicant.</p>
      <form id="scoresForm">
        <div class="table-scroll">
          <table class="scoring-table">
            <thead><tr><th>Evaluator</th>${DIMENSIONS.map((d) => `<th>${escapeHtml(d.label)}</th>`).join('')}<th>Row Total</th></tr></thead>
            <tbody>
              ${rows}
              <tr class="ai-row"><td class="judge-label">${escapeHtml(AI_ROW.label)}</td>${aiCells}<td class="row-total">${aiTotal === null ? '—' : aiTotal}</td></tr>
            </tbody>
            <tfoot><tr><td colspan="${DIMENSIONS.length + 1}">Judges' Average Score</td><td class="grand-total">${judgesAvg === null ? 'Not yet scored' : judgesAvg + ' / ' + MAX_ROW_TOTAL + ' (avg of ' + judgesCount + ' judge' + (judgesCount === 1 ? '' : 's') + ')'}</td></tr></tfoot>
          </table>
        </div>
        <label class="ai-notes-label">AI reasoning (optional, editable)
          <textarea name="ai_notes" rows="3" class="ai-notes-textarea" placeholder="Short rationale behind the AI preliminary read...">${escapeHtml(aiRowData.notes || '')}</textarea>
        </label>
        <p class="hint ai-disclaimer">The "${escapeHtml(AI_ROW.label)}" row is an optional, preliminary AI-assisted read entered by whoever processes the application — it does <strong>not</strong> carry the subject-matter expertise of the panel judges, is not a substitute for expert review, and is excluded from the judges' average score above. Treat it as a rough first impression only.</p>
        <button type="submit" class="btn-primary" id="scoresSaveBtn">Save Scores</button>
      </form>
    </section>`;
}

function renderAdminApplication() {
  if (!requireAdminOrRedirect()) return;
  const application = applications.find((a) => a.id === state.selectedApplicationId);
  const best = application.scoring.best;
  const banner = application.scoring.meetsAllCriteria
    ? `<div class="alert alert-success">Meets all eligibility criteria for the ${escapeHtml(SCHOLARSHIP.name)}.</div>`
    : `<div class="alert alert-warning">Does not currently meet all eligibility criteria for the ${escapeHtml(SCHOLARSHIP.name)} — see the breakdown below.</div>`;
  const checklist = best.criteriaResults.map((c) => `<li class="${c.met ? 'met' : 'unmet'}">${c.met ? '&#10003;' : '&#10007;'} ${escapeHtml(c.label)}</li>`).join('');
  const departmentDisplay = application.department === OTHER_DEPARTMENT_VALUE && application.departmentOther
    ? `${application.department} — ${application.departmentOther}`
    : application.department;
  const docLink = (fileMeta, label) => fileMeta && fileMeta.url
    ? `<a class="btn-secondary" href="${escapeHtml(fileMeta.url)}" target="_blank" rel="noopener">&#128196; ${escapeHtml(label)}</a>`
    : `<span class="btn-secondary" style="cursor:default;">&#128196; ${escapeHtml(label)} (file not available)</span>`;

  document.getElementById('app').innerHTML = `
    ${header({ titleLine: 'Admin Review Dashboard', adminNav: true })}
    <main class="wrap">
      <p><a href="#" onclick="go('adminDashboard');return false;">&larr; All applications</a></p>
      ${banner}
      <section class="intro-card">
        <h1>${escapeHtml(application.fullName)}</h1>
        <div class="detail-grid">
          <div><span class="hint">Email</span><br />${escapeHtml(application.email)}</div>
          <div><span class="hint">Phone</span><br />${escapeHtml(application.phone)}</div>
          <div><span class="hint">Institution</span><br />${escapeHtml(application.institution)}</div>
          <div><span class="hint">Department</span><br />${escapeHtml(departmentDisplay)}</div>
          <div><span class="hint">Program Type</span><br />${escapeHtml(application.programType)}</div>
          <div><span class="hint">First-Year Graduate Student?</span><br />${escapeHtml(application.firstYearGrad)}</div>
          <div><span class="hint">Submitted</span><br />${new Date(application.submittedAt).toLocaleString()}</div>
        </div>
        <div class="doc-links">
          ${docLink(application.researchSummaryFile, 'Research Summary: ' + application.researchSummaryFileName)}
          ${docLink(application.resumeFile, 'Resume: ' + application.resumeFileName)}
          ${docLink(application.coverLetterFile, 'Cover Letter: ' + application.coverLetterFileName)}
          ${docLink(application.proofOfEnrollmentFile, 'Proof of Enrollment: ' + application.proofOfEnrollmentFileName)}
        </div>
        <div class="text-block">
          <span class="hint">Eligibility criteria breakdown — ${best.metCount}/${best.totalCount} criteria met (${best.percentage}%)</span>
          <ul class="criteria-checklist">${checklist}</ul>
        </div>
      </section>
      ${judgingRubricSection(application)}
    </main>
  `;

  document.getElementById('scoresForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const judgeScores = application.judgeScores || emptyJudgeScores();
    JUDGES.forEach((j) => {
      const row = judgeScores[j.id] || {};
      row.name = String(fd.get(j.id + '_name') || '').trim();
      DIMENSIONS.forEach((d) => { row[d.id] = parseScoreValue(fd.get(j.id + '_' + d.id)); });
      judgeScores[j.id] = row;
    });
    const aiRowData = judgeScores[AI_ROW.id] || {};
    aiRowData.notes = String(fd.get('ai_notes') || '').trim();
    DIMENSIONS.forEach((d) => { aiRowData[d.id] = parseScoreValue(fd.get(AI_ROW.id + '_' + d.id)); });
    judgeScores[AI_ROW.id] = aiRowData;

    const btn = document.getElementById('scoresSaveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await postToBackend({ action: 'saveJudgeScores', key: state.adminKey, applicationId: application.id, judgeScores });
      application.judgeScores = judgeScores;
      render();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Save Scores';
      alert('Could not save scores: ' + err.message + '. Please try again.');
    }
  });
}

function render() {
  state.errors = (state.view === 'apply' || state.view === 'turnbullApply') ? state.errors : null;
  if (state.view === 'home') return renderHome();
  if (state.view === 'apply') return renderApply();
  if (state.view === 'success') return renderSuccess();
  if (state.view === 'turnbullApply') return renderTurnbullApply();
  if (state.view === 'turnbullSuccess') return renderTurnbullSuccess();
  if (state.view === 'adminLogin') return renderAdminLogin();
  if (state.view === 'adminDashboard') return renderAdminDashboard();
  if (state.view === 'adminApplication') return renderAdminApplication();
  if (state.view === 'adminTurnbullEntry') return renderAdminTurnbullEntry();
}

render();
</script>
</body>
</html>
